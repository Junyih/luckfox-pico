name: Build Alpine Image

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Tashkent


jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Alpine rootfs
        run: sudo ./rootfs.sh

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-alpine
          path: output/rootfs-alpine.tar.gz

  build-system:
    strategy:
      matrix:
        device: [ pico-plus, pico-mini-b, pico-pro-max ]
    runs-on: ubuntu-latest
    needs: build-rootfs
    steps:
      - name: Checkout code & submodules
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
      
      - name: Download built rootfs
        uses: actions/download-artifact@v4
        with:
          name: rootfs-alpine

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git ssh make gcc gcc-multilib g++-multilib module-assistant expect g++ gawk texinfo libssl-dev bison flex fakeroot cmake unzip gperf autoconf device-tree-compiler libncurses5-dev pkg-config bc python-is-python3 passwd openssl openssh-server openssh-client vim file cpio rsync
      
      - name: Build final sysupgrade.img
        run: ./system.sh -f rootfs-alpine.tar.gz -d ${{ matrix.device }}
      
      - name: Upload finished sysupgrade image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-sysupgrade
          path: output/*.img
          if-no-files-found: error

  release:
    name: Publish all firmware images
    runs-on: ubuntu-latest
    needs: build-system

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-sysupgrade"
          path: release-output
          
      - name: Check firmware images
        run: |
          find release-output -type f -name '*.img' -print

          count=$(find release-output -type f -name '*.img' | wc -l)

          if [ "$count" -ne 3 ]; then
            echo "ERROR: Expected 3 firmware images, found $count"
            exit 1
          fi

          echo "Found all 3 firmware images."

      - name: Generate release tag
        id: vars
        run: |
          echo "tag=build-$(date +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}" \
            >> "$GITHUB_OUTPUT"

      - name: Prepare uniquely named firmware assets
        run: |
          mkdir -p release-assets

          cp release-output/pico-plus-sysupgrade/*.img \
             release-assets/pico-plus-alpine.img

          cp release-output/pico-mini-b-sysupgrade/*.img \
             release-assets/pico-mini-b-alpine.img

          cp release-output/pico-pro-max-sysupgrade/*.img \
             release-assets/pico-pro-max-alpine.img

          echo "=== Release assets ==="
          ls -lh release-assets/
          test "$(find release-assets -maxdepth 1 -type f -name '*.img' | wc -l)" -eq 3

      - name: Publish firmware release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Firmware ${{ steps.vars.outputs.tag }}"
          body: |
            Alpine Linux firmware

            Devices:
            - pico-plus
            - pico-mini-b
            - pico-pro-max

            Commit: ${{ github.sha }}
          make_latest: true
          files: |
            release-assets/pico-plus-alpine.img
            release-assets/pico-mini-b-alpine.img
            release-assets/pico-pro-max-alpine.img
