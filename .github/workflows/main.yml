name: Build Alpine Image

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Tashkent


jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Alpine rootfs
        run: sudo ./rootfs.sh

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-alpine
          path: output/rootfs-alpine.tar.gz

  build-system:
    strategy:
      matrix:
        device: [ pico-plus, pico-mini-b, pico-pro-max ]
    runs-on: ubuntu-latest
    needs: build-rootfs
    steps:
      - name: Checkout code & submodules
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
      
      - name: Download built rootfs
        uses: actions/download-artifact@v4
        with:
          name: rootfs-alpine

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git ssh make gcc gcc-multilib g++-multilib module-assistant expect g++ gawk texinfo libssl-dev bison flex fakeroot cmake unzip gperf autoconf device-tree-compiler libncurses5-dev pkg-config bc python-is-python3 passwd openssl openssh-server openssh-client vim file cpio rsync
      
      - name: Build final sysupgrade.img
        run: ./system.sh -f rootfs-alpine.tar.gz -d ${{ matrix.device }}
      
      - name: Upload finished sysupgrade image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-sysupgrade
          path: output/*.img
          if-no-files-found: error

  release:
    name: Publish all firmware images
    runs-on: ubuntu-latest
    needs: build-system

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-sysupgrade"
          path: release-output
          
      - name: Prepare uniquely named firmware assets
        run: |
          mkdir -p release-assets

          for device in pico-plus pico-mini-b pico-pro-max; do
            src="release-output/${device}-sysupgrade"
            test -d "$src" || { echo "ERROR: missing artifact for $device"; exit 1; }
            cp "$src"/*.img "release-assets/${device}-alpine.img"
            test -s "release-assets/${device}-alpine.img"
          done

          echo "=== Release assets ==="
          ls -lh release-assets/

      - name: Generate release tag
        id: vars
        run: |
          echo "tag=build-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish firmware release
        if: env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Firmware ${{ steps.vars.outputs.tag }}"
          body: |
            Alpine Linux firmware

            Devices:
            - pico-plus
            - pico-mini-b
            - pico-pro-max

            Commit: ${{ github.sha }}
          make_latest: true
          files: |
            release-assets/*.img
